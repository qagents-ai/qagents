site_name: QAgents
site_url: https://qagents-ai.github.io/qagents/
site_description: Long-running Python agents with persistent sessions, scoped memory and human review.
repo_url: https://github.com/qagents-ai/qagents
repo_name: qagents-ai/qagents
edit_uri: ""

theme:
  name: material
  # The journal-q mark (assets/logo/ at the repository root; copies in docs/assets/).
  logo: assets/qagents-icon.svg
  favicon: assets/qagents-icon-32.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Capabilities: capabilities.md
  - Concepts:
      - The loop: concepts/loop.md
      - Tools: concepts/tools.md
      - Permissions and approvals: concepts/permissions.md
      - Sessions and recovery: concepts/sessions.md
      - Streaming and cancel: concepts/streaming.md
      - Structured output: concepts/structured-output.md
      - Several agents and workflows: concepts/multi-agent.md
      - External agents: concepts/external-agents.md
      - Hooks, context and tracing: concepts/hooks.md
  - Guides:
      - Support review agent: guides/support-review.md
      - Indexed repository activity: guides/repository-activity.md
      - Effects preview status: effects-preview.md
      - Recover an external action: guides/recover-effect.md
      - QAgent Gym and integrations: integrations/gym.md
      - Model providers: providers.md
      - Ready-made tools: toolkits.md
      - Testing agents: testing.md
      - Repeated-run reliability: guides/reliability.md
      - Serving over HTTP: serving.md
      - Devvi as a coding worker: integrations/devvi.md
      - Any ACP agent: integrations/acp.md
      - Serving tools over MCP: integrations/mcp-server.md
      - Docs for coding agents: coding-agents.md
  - Design:
      - Principles and guarantees: design.md
      - Comparison with other frameworks: comparison.md
  - API reference:
      - Agent: reference/agent.md
      - Tools: reference/tools.md
      - Permissions: reference/permissions.md
      - Hooks: reference/hooks.md
      - Sessions: reference/session.md
      - Events and results: reference/events.md
      - Messages: reference/messages.md
      - Models: reference/models.md
      - Workflows: reference/workflow.md
      - Context: reference/context.md
      - Tracing: reference/tracing.md
      - Toolkits: reference/toolkits.md
      - External agents: reference/external.md
      - Errors: reference/errors.md
      - Prompts: reference/prompts.md
