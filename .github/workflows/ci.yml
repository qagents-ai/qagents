name: QAgents tests

on:
  push:
    branches: [main, 'effects/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q -m "not network"
      - run: python -m pytest -q -m process tests/process
        env:
          QAGENTS_RUN_PROCESS_TESTS: '1'
      - run: python scripts/build_llms_txt.py --check
      - run: python -m mkdocs build --strict

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qagents
          POSTGRES_PASSWORD: qagents
          POSTGRES_DB: qagents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qagents -d qagents"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      QAGENTS_TEST_POSTGRES_DSN: postgresql://qagents:qagents@127.0.0.1:5432/qagents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q -m "not network"
