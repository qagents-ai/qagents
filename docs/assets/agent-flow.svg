<text x="116" y="487" fill="#8ce6c4" font-size="14" font-weight="700" text-anchor="start">CONTINUITY LAYER</text>
<text x="116" y="524" fill="#f7fbfa" font-size="24" font-weight="600" text-anchor="start">Journal + structured state</text>
