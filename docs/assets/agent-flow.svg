<rect x="0" y="0" width="1200" height="620" rx="26" fill="url(#dots)" stroke="none"/>
<text x="48" y="48" fill="#8ce6c4" font-size="15" font-weight="700" text-anchor="start">01</text>
<text x="90" y="48" fill="#a8becb" font-size="15" font-weight="600" text-anchor="start">THE AGENT JOURNEY</text>
<text x="48" y="105" fill="#f7fbfa" font-size="42" font-weight="650" text-anchor="start">Deep work, with continuity.</text>
<text x="48" y="143" fill="#a8becb" font-size="20" font-weight="400" text-anchor="start">Plan across steps. Delegate work. Keep context when the conversation pauses.</text>
