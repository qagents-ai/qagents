<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Deep work, with continuity</title>
<desc id="desc">A long-running agent plans, uses typed tools, pauses for human review and resumes. Sessions retain execution history and state. Application memory supplies scoped context.</desc>
<defs>
              <linearGradient id="night" x2="1" y2="1">
                <stop stop-color="#122b38"/><stop offset="1" stop-color="#101722"/>
              </linearGradient>
              <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1" fill="#476272" opacity=".22"/>
              </pattern>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#6d9b9a" stroke-width="1.5"/>
              </marker>
            </defs>
<g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
