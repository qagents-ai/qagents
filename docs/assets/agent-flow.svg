<text x="643" y="487" fill="#c4b7fa" font-size="14" font-weight="700" text-anchor="start">APPLICATION MEMORY</text>
<text x="643" y="524" fill="#f7fbfa" font-size="24" font-weight="600" text-anchor="start">Scoped retrieval + Gym playbooks</text>
<text x="48" y="598" fill="#a8becb" font-size="16" font-weight="400" text-anchor="start">Provider choice, memory scope and action safety remain explicit application decisions.</text>
