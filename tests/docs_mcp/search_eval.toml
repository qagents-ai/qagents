# Questions a newcomer or a coding agent types into `search`, with the answers that should
# come first. Read by tests/docs_mcp/test_search_eval.py: the opt-in benchmark
# (`pytest tests/docs_mcp -m docs_benchmark`) reports top-1 and top-3 hit rates over all of
# them, and the default suite pins the questions listed in `PINNED` there.
#
# `expected` lists acceptable first answers. Each one is a page (`concepts/tools.md`, any of
# its sections matches), a section (`concepts/tools.md#flags`), an example file
# (`examples/patterns/supervisor.py`) or an API source file (`src/qagents/evals.py`, any
# object defined in it matches). `style` is `bare` (a few words), `natural` (a sentence) or
# `synonym` (words the docs do not use for the idea).

# --- getting started --------------------------------------------------------------------

[[question]]
topic = "getting started"
style = "bare"
query = "getting started"
expected = ["getting-started.md"]

[[question]]
topic = "getting started"
style = "natural"
query = "how do I install qagents"
expected = ["getting-started.md#install", "README.md#quickstart"]

[[question]]
topic = "getting started"
style = "synonym"
query = "hello world agent"
expected = ["getting-started.md", "examples/quickstart.py"]

[[question]]
topic = "getting started"
style = "natural"
query = "can I try an agent without an API key"
expected = ["getting-started.md#see-it-run-without-a-key", "testing.md"]

[[question]]
topic = "getting started"
style = "bare"
query = "first agent"
expected = ["getting-started.md"]

